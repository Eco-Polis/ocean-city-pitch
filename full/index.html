function depthOf(e, i, n){ return e.bg ? .12 : /^(sky|paper|wall|floor|ground|glow|bg)/.test(e.n) ? .25 : .35 + .65*i/Math.max(1,n-1); }
function render(i){
  for (const el of live.values()) el.remove(); live.clear();
  const list = DECK.slides[i];
  list.forEach((e, k) => { const el = make(e, depthOf(e, k, list.length)); stage.insertBefore(el, dust); live.set(e.id, el); });
  cur = i; update();
}
function update(){
  const n = DECK.engine === 'morph' ? DECK.slides.length - 1 : DECK.slides.length;
  const p = DECK.engine === 'morph' ? Math.max(cur, 1) : cur + 1;
  document.getElementById('pos').textContent = `${p} / ${n}`;
  if (history.replaceState) history.replaceState(null, '', '#' + p);
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const EASE_M = 'cubic-bezier(.62,0,.24,1)';

async function morphTo(j){
  const next = DECK.slides[j], seen = new Set(), jobs = [];
  next.forEach((e, k) => {
    seen.add(e.id);
    const old = live.get(e.id), depth = depthOf(e, k, next.length);
    const dur = 1250*MS + (e.bg ? 200 : 0), delay = e.bg ? 0 : Math.min(140, k*12)*MS;
    if (old){
      const a = old._e.box, b = e.box;
      const r0 = (old._e.rot||0)+'deg', r1 = (e.rot||0)+'deg';
      jobs.push(old.animate([{left:a[0]+'px',top:a[1]+'px',width:a[2]+'px',height:a[3]+'px',rotate:r0},{left:b[0]+'px',top:b[1]+'px',width:b[2]+'px',height:b[3]+'px',rotate:r1}],{duration:dur,delay,easing:EASE_M,fill:'forwards'}).finished.then(()=>{setBox(old,b); old.style.rotate=r1; old.getAnimations().forEach(x=>x.cancel());}));
      const im = old.querySelector('.crop img');
      if (im && e.k === 'img' && JSON.stringify(old._e.crop) !== JSON.stringify(e.crop)){
        const s0 = {left:im.style.left, top:im.style.top, width:im.style.width, height:im.style.height}, t = document.createElement('i'); cropStyle(t, e.crop);
        jobs.push(im.animate([{left:s0.left,top:s0.top,width:s0.width,height:s0.height},{left:t.style.left,top:t.style.top,width:t.style.width,height:t.style.height}],{duration:dur,delay,easing:EASE_M,fill:'forwards'}).finished.then(()=>{cropStyle(im,e.crop); im.getAnimations().forEach(x=>x.cancel());}));
      }
      const moved = Math.hypot(b[0]-a[0], b[1]-a[1]);
      if (moved > 700 && !e.bg) old.querySelector('.mv').animate([{filter:'blur(0)'},{filter:'blur(5px)',offset:.5},{filter:'blur(0)'}],{duration:dur,delay});
      old._e = e; old._depth = depth;
      stage.insertBefore(old, dust);
    } else {
      const el = make(e, depth); el.style.opacity = 0; stage.insertBefore(el, dust); live.set(e.id, el);
      jobs.push(el.animate([{opacity:0, filter:'blur(6px)'},{opacity:1, filter:'blur(0)'}],{duration:dur*.9,delay:delay+dur*.1,easing:'ease-out',fill:'forwards'}).finished.then(()=>{el.style.opacity=1; el.getAnimations().forEach(x=>x.cancel());}));
    }
  });
  for (const [id, el] of live) if (!seen.has(id)){
    stage.insertBefore(el, stage.firstChild);
    jobs.push(el.animate([{opacity:1},{opacity:0, filter:'blur(6px)'}],{duration:800*MS,easing:'ease-in',fill:'forwards'}).finished.then(()=>{el.remove(); live.delete(id);}));
  }
  await Promise.all(jobs); cur = j; update();
}

function fxFrames(e, phase){
  const d = phase === 'in' ? e.i : e.o, fx = (d && 'LRTB'.includes(d)) ? e.fx : 'fade';
  const [x, y, w, h] = e.box;
  let from;
  if (fx === 'peek') from = {L:`translateX(-112.5%)`, R:`translateX(112.5%)`, T:`translateY(-112.5%)`, B:`translateY(112.5%)`}[d];
  else if (fx === 'fly') from = {L:`translateX(${-(x+w)-40}px)`, R:`translateX(${1960-x}px)`, T:`translateY(${-(y+h)-40}px)`, B:`translateY(${1120-y}px)`}[d];
  const f = fx === 'fade' ? [{opacity:0},{opacity:1}] : [{transform:from, opacity: fx==='fly'?1:1},{transform:'none', opacity:1}];
  return {f: phase === 'in' ? f : f.slice().reverse(), clip: fx === 'peek'};
}
async function peekIn(i){
  render(i); const jobs = [];
  for (const el of live.values()){
    const e = el._e, {f, clip} = fxFrames(e, 'in'), mv = el.querySelector('.mv');
    if (clip) el.style.overflow = 'hidden';
    mv.style.opacity = 0;
    jobs.push(mv.animate(f, {duration:e.t[1]*MS, delay:e.t[0]*MS, easing:'cubic-bezier(.2,.75,.25,1)', fill:'both'}).finished.then(()=>{mv.style.opacity=''; el.style.overflow=''; mv.getAnimations().forEach(x=>x.cancel());}));
  }
  await Promise.all(jobs);
}
async function peekOut(){
  const els = [...live.values()], texts = els.filter(el => el._e.fx==='peek' && !/^(banner|photo|frame|name|thanks|eyebrow)/.test(el._e.n));
  const jobs = els.map(el => {
    const e = el._e, {f, clip} = fxFrames(e, 'out'), mv = el.querySelector('.mv');
    let delay = 0, dur = 550;
    if (texts.includes(el)){ delay = 30*(texts.length-1-texts.indexOf(el)); dur = 500; }
    else if (/^(hero|pavilion|photo|frame)/.test(e.n)){ delay = 100; dur = 600; }
    if (clip) el.style.overflow = 'hidden';
    return mv.animate(f, {duration:dur*MS, delay:delay*MS, easing:'cubic-bezier(.55,0,.8,.3)', fill:'forwards'}).finished;
  });
  await Promise.all(jobs); await wait(100*MS);
}

async function go(j){
  if (busy || j < 0 || j >= DECK.slides.length || j === cur) return;
  busy = true;
  try {
    if (DECK.engine === 'morph'){
      if (j === cur + 1) await morphTo(j); else render(j);
    } else {
      if (j === cur + 1){ await peekOut(); await peekIn(j); } else render(j);
    }
  } finally { busy = false; }
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
addEventListener('keydown', ev => {
  if (['ArrowRight','PageDown',' ','Enter'].includes(ev.key)){ ev.preventDefault(); next(); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(ev.key)){ ev.preventDefault(); prev(); }
  else if (ev.key === 'Home') go(DECK.engine === 'morph' ? 1 : 0);
  else if (ev.key === 'f' || ev.key === 'F') toggleFs();
});
stage.addEventListener('click', next);
function toggleFs(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }
document.getElementById('fs').onclick = e => { e.stopPropagation(); toggleFs(); };
setTimeout(() => document.getElementById('hint').style.opacity = 0, 3000);
addEventListener('keydown', () => document.getElementById('hint').style.opacity = 0, {once: true});

// parallax: layers drift against the pointer, deeper layers less
let px = 0, py = 0, tx_ = 0, ty_ = 0;
addEventListener('pointermove', e => { px = e.clientX/innerWidth - .5; py = e.clientY/innerHeight - .5; });
(function loop(){
  tx_ += (px - tx_)*.06; ty_ += (py - ty_)*.06;
  if (!reduce) for (const el of live.values()){ const k = el._depth*28; el.querySelector('.par').style.transform = `translate(${-tx_*k}px,${-ty_*k}px)`; }
  requestAnimationFrame(loop);
})();

// floating gold dust
(function(){
  const g = dust.getContext('2d'), P = Array.from({length: reduce ? 0 : 70}, () => ({x:Math.random()*1920, y:Math.random()*1080, r:.6+Math.random()*2.2, v:.15+Math.random()*.45, a:Math.random()*6.28}));
  (function f(){
    g.clearRect(0,0,1920,1080);
    for (const p of P){ p.y -= p.v; p.a += .01; p.x += Math.sin(p.a)*.3; if (p.y < -10){ p.y = 1090; p.x = Math.random()*1920; }
      const al = .25 + .35*Math.sin(p.a*2)**2; g.fillStyle = `rgba(232,190,110,${al})`; g.beginPath(); g.arc(p.x,p.y,p.r,0,6.28); g.fill(); }
    requestAnimationFrame(f);
  })();
})();

const start = parseInt(location.hash.slice(1)) || 0;
const auto = parseFloat(new URLSearchParams(location.search).get('auto'));
if (DECK.engine === 'morph'){
  if (start > 1) render(start); else { render(0); setTimeout(() => go(1), 250); }
} else { if (start > 1) render(start - 1); else peekIn(0); }
if (auto > 0) setInterval(() => { if (!busy) { if (cur < DECK.slides.length - 1) next(); } }, auto*1000);
window.deck = {go, next, prev, get cur(){return cur}, get busy(){return busy}, count: DECK.slides.length, engine: DECK.engine};
</script>
</body>
</html>
